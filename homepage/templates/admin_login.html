<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 로그인 · 한국엑스퍼트교육원</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --navy: #152b3d; --blue: #3182f6; --ink: #191f28; --ink-2: #4e5968; --line: #e5e8eb; --bg-2: #f4f6f8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #223e49; font-family: "Toss Product Sans", "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); word-break: keep-all; }
  .card { width: 100%; max-width: 400px; background: #fff; border-radius: 16px; padding: 36px 32px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
  .brand { margin-bottom: 22px; }
  .brand img { height: 40px; width: auto; }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
  p { margin: 0 0 22px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
  label { display: block; font-size: 14px; font-weight: 700; margin: 0 0 6px; }
  input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid #d4dae6; font: inherit; font-size: 16px; margin-bottom: 14px; }
  input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(36, 87, 214, .15); }
  button { width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: var(--navy); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  button:hover { background: #223e49; }
  .err { background: #fdecec; color: #a62323; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }
  .back { display: block; text-align: center; margin-top: 18px; font-size: 14px; color: var(--ink-2); text-decoration: none; }
  .back:hover { color: var(--navy); }
</style>
</head>
<body>
<form class="card" method="post" action="/admin/login">
  <div class="brand"><img src="/static/logo-h.png" alt="한국엑스퍼트교육원"></div>
  {% if setup %}
  <h1>관리자 비밀번호 정하기</h1>
  <p>처음 접속하셨습니다. 앞으로 관리자 페이지에 들어올 때 쓸 비밀번호를 정해 주세요. 8자 이상이어야 합니다.</p>
  {% else %}
  <h1>관리자 로그인</h1>
  <p>홈페이지의 사진, 회사소개서, 바로가기, 문의 내역을 관리합니다.</p>
  {% endif %}
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label for="password">{{ '새 비밀번호' if setup else '비밀번호' }}</label>
  <input type="password" id="password" name="password" autocomplete="{{ 'new-password' if setup else 'current-password' }}" autofocus required minlength="{{ 8 if setup else 1 }}">
  {% if setup %}
  <label for="password2">비밀번호 다시 입력</label>
  <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8">
  {% endif %}
  <button type="submit">{{ '비밀번호 정하고 들어가기' if setup else '들어가기' }}</button>
  <a class="back" href="/">← 홈페이지로</a>
</form>
</body>
</html>
