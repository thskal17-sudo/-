[project]
name = "edugen"
version = "0.1.0"
description = "네이버 스마트스토어용 교육자료 썸네일·상세페이지 자동 생성"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.80",
  "pydantic>=2",
  "jinja2>=3.1",
  "pymupdf>=1.24",
  "pillow>=10",
  "playwright>=1.45",
  "typer>=0.12",
  "pyyaml>=6",
]

[project.scripts]
edugen = "edugen.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
